name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # prisma.config.ts requires DATABASE_URL; generation doesn't connect,
      # so the placeholder from .env.example is enough.
      - name: Prepare env
        run: cp .env.example .env

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
